<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>视频质检助手</h2>

    <!-- 当前质检状态 -->
    <div class="current-card" id="currentCard" style="display:none">
      <div class="current-header">
        <span class="current-label">正在质检</span>
        <span class="current-timer" id="currentTimer">00:00:00</span>
      </div>
      <div class="current-title" id="currentTitle">--</div>
      <div class="current-meta">
        <span>视频时长: <strong id="currentVideoDur">--</strong></span>
      </div>
      <div class="current-actions">
        <button id="pauseBtn" class="btn-secondary">暂停计时</button>
        <button id="passBtn" class="btn-pass">通过</button>
        <button id="failBtn" class="btn-fail">不通过</button>
      </div>

      <!-- 不通过原因面板 -->
      <div class="fail-panel" id="failPanel" style="display:none">
        <div class="fail-title">选择不通过原因（可多选）</div>
        <div class="fail-reasons" id="failReasons"></div>
        <div class="fail-remark">
          <input type="text" id="failRemark" placeholder="补充备注（可选）">
        </div>
        <div class="fail-actions">
          <button id="failCancel" class="btn-secondary">取消</button>
          <button id="failConfirm" class="btn-fail">确认不通过</button>
        </div>
      </div>
    </div>

    <!-- 无任务时提示 -->
    <div class="no-current" id="noCurrent">
      <p>当前没有进行中的质检任务</p>
      <p class="hint">打开含视频的质检页面后自动开始计时</p>
    </div>

    <!-- 统计面板 -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">今日质检</span>
        <span class="stat-value" id="todayCount">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">通过</span>
        <span class="stat-value pass" id="passCount">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">不通过</span>
        <span class="stat-value fail" id="failCount">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">通过率</span>
        <span class="stat-value" id="passRate">--</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat-item wide">
        <span class="stat-label">今日质检总耗时</span>
        <span class="stat-value" id="todayTime">00:00:00</span>
      </div>
      <div class="stat-item wide">
        <span class="stat-label">平均耗时</span>
        <span class="stat-value" id="avgTime">00:00:00</span>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button id="exportCsvBtn" class="btn-primary">导出 CSV</button>
      <button id="exportTxtBtn" class="btn-secondary">导出 TXT</button>
      <button id="clearBtn" class="btn-danger">清空</button>
      <button id="settingsBtn" class="btn-icon" title="设置">&#9881;</button>
    </div>

    <!-- 记录列表 -->
    <div class="section-title">质检记录</div>
    <div class="record-list" id="recordList">
      <p class="empty">暂无记录</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
