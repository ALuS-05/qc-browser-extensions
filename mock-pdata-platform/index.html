<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDATA质检平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 左侧导航栏 -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">PD</div>
      <div class="logo-text">
        <div class="logo-title">PDATA质检平台</div>
        <div class="logo-sub">质检管理平台</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-group">
        <div class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
          <span class="nav-icon">📊</span>统计首页
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">运营管理</div>
        <div class="nav-item" data-page="recordings" onclick="navigateTo('recordings')">
          <span class="nav-icon">📋</span>录制记录
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">质检管理</div>
        <div class="nav-item" data-page="pool" onclick="navigateTo('pool')">
          <span class="nav-icon">📥</span>质检池
        </div>
        <div class="nav-item" data-page="mine" onclick="navigateTo('mine')">
          <span class="nav-icon">📝</span>我的审核任务
        </div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-version">v1.0.0 模拟版</div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">
          <span class="breadcrumb-item">首页</span>
          <span class="breadcrumb-sep">/</span>
          <span class="breadcrumb-item active" id="breadcrumbCurrent">统计首页</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-actions">
          <button class="topbar-btn" title="刷新" onclick="location.reload()">🔄</button>
          <button class="topbar-btn" title="帮助">❓</button>
        </div>
        <div class="user-info">
          <div class="user-avatar">q</div>
          <span class="user-name">qczyj05_nr</span>
        </div>
        <button class="btn-logout">退出登录</button>
      </div>
    </header>

    <!-- 页面内容容器 -->
    <div class="content" id="content">
      <!-- 页面内容由 JS 动态渲染 -->
      <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
      </div>
    </div>
  </main>

  <!-- 全局提示 -->
  <div class="toast" id="toast"></div>

  <!-- 模态框容器 -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal" id="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">提示</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
